<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics II Math Review Randomizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root{--primary:#0077da;--secondary:#004d80;--accent:#ffcc00;--paper:#f7fbff;--ink:#14213d;--border:#dbe7f3;}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
    .hero{background:linear-gradient(135deg,var(--secondary),var(--primary));}
    .card{background:white;border:1px solid var(--border);border-radius:1.25rem;box-shadow:0 10px 25px rgba(0,0,0,.06)}
    .choice{border:1px solid var(--border);border-radius:.9rem;padding:.8rem;cursor:pointer;display:flex;gap:.65rem;align-items:flex-start;background:#fff;}
    .choice:hover{border-color:var(--primary);background:#f0f7ff}
    .choice.correct{border-color:#0f766e;background:#ccfbf1}
    .choice.incorrect{border-color:#be123c;background:#ffe4e6}
    .pill{border:1px solid var(--border);background:white;border-radius:999px;padding:.3rem .7rem;font-size:.8rem;font-weight:800}
    .btn{border-radius:.9rem;padding:.75rem 1rem;font-weight:900;transition:.15s ease;}
    .btn:hover{transform:translateY(-1px)}
    @media print{.no-print{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:white}}
  </style>
</head>
<body>
  <header class="hero text-white">
    <div class="max-w-6xl mx-auto px-5 py-10">
      <p class="uppercase tracking-[.25em] text-sm opacity-90">Physics II Final Exam</p>
      <h1 class="text-4xl md:text-5xl font-black mt-2">Math + Concept Review Randomizer</h1>
      <p class="mt-4 text-blue-50 max-w-3xl text-lg">Generate a custom multiple-choice review set by topic or from the full final-exam scope. This version uses no images and no AI explanations.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8 space-y-6">
    <section class="card p-5 no-print">
      <h2 class="text-2xl font-black">Build Your Review</h2>
      <div class="grid md:grid-cols-4 gap-4 mt-4">
        <label class="font-bold">Topic
          <select id="topicSelect" class="mt-1 w-full border rounded-xl p-2">
            <option value="All">All Topics</option>
          </select>
        </label>
        <label class="font-bold">Number of Questions
          <input id="countInput" type="number" value="15" min="1" max="80" class="mt-1 w-full border rounded-xl p-2" />
        </label>
        <label class="font-bold">Difficulty Mix
          <select id="mixSelect" class="mt-1 w-full border rounded-xl p-2">
            <option value="balanced">50/50 Standard + Challenge</option>
            <option value="standard">Standard Only</option>
            <option value="challenge">Challenge Only</option>
            <option value="any">Any Random</option>
          </select>
        </label>
        <label class="font-bold">Seed / Version
          <input id="seedInput" placeholder="optional" class="mt-1 w-full border rounded-xl p-2" />
        </label>
      </div>
      <div class="flex flex-wrap gap-3 mt-5">
        <button class="btn bg-blue-700 text-white" onclick="generateQuiz()">Generate Review</button>
        <button class="btn bg-yellow-400 text-slate-900" onclick="finishQuiz()">Finish / Score</button>
        <button class="btn bg-white border" onclick="window.print()">Print / Save PDF</button>
        <button class="btn bg-white border" onclick="resetAll()">Reset</button>
      </div>
    </section>

    <section id="statusCard" class="card p-5 hidden">
      <div class="flex flex-wrap justify-between gap-3 items-center">
        <div>
          <p id="progressText" class="font-black text-xl"></p>
          <p id="topicText" class="text-slate-600"></p>
        </div>
        <div class="flex gap-2 no-print">
          <button class="btn bg-white border" onclick="prevQuestion()">Previous</button>
          <button class="btn bg-blue-700 text-white" onclick="nextQuestion()">Next</button>
        </div>
      </div>
    </section>

    <section id="questionArea" class="card p-6 hidden"></section>
    <section id="summaryArea" class="card p-6 hidden"></section>
  </main>

  <script src="questions.js"></script>
  <script>
    let quiz = [];
    let current = 0;
    let answers = {};

    function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
    function hashSeed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
    function shuffle(arr, rand=Math.random){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    function initTopics(){
      const topics=[...new Set(QUESTIONS.map(q=>q.topic))].sort();
      const sel=document.getElementById('topicSelect');
      topics.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
    }

    function generateQuiz(){
      const topic=document.getElementById('topicSelect').value;
      const count=Math.max(1, parseInt(document.getElementById('countInput').value||'15',10));
      const mix=document.getElementById('mixSelect').value;
      const seed=document.getElementById('seedInput').value.trim();
      const rand=seed ? mulberry32(hashSeed(seed)) : Math.random;
      let pool=QUESTIONS.filter(q=>topic==='All'||q.topic===topic);
      if(mix==='standard') pool=pool.filter(q=>q.level==='standard');
      if(mix==='challenge') pool=pool.filter(q=>q.level==='challenge');
      if(mix==='balanced'){
        const standard=shuffle(pool.filter(q=>q.level==='standard'), rand);
        const challenge=shuffle(pool.filter(q=>q.level==='challenge'), rand);
        const half=Math.floor(count/2);
        quiz=[...standard.slice(0, count-half), ...challenge.slice(0, half)];
        if(quiz.length<count){
          const used=new Set(quiz.map(q=>q.id));
          quiz.push(...shuffle(pool.filter(q=>!used.has(q.id)), rand).slice(0,count-quiz.length));
        }
        quiz=shuffle(quiz, rand);
      } else {
        quiz=shuffle(pool, rand).slice(0,count);
      }
      current=0; answers={};
      localStorage.setItem('phys2-math-quiz', JSON.stringify({quiz,answers,current}));
      document.getElementById('statusCard').classList.remove('hidden');
      document.getElementById('questionArea').classList.remove('hidden');
      document.getElementById('summaryArea').classList.add('hidden');
      renderQuestion();
    }

    function saveState(){ localStorage.setItem('phys2-math-quiz', JSON.stringify({quiz,answers,current})); }
    function restoreState(){
      try{const s=JSON.parse(localStorage.getItem('phys2-math-quiz')||'null');if(s&&s.quiz&&s.quiz.length){quiz=s.quiz;answers=s.answers||{};current=s.current||0;document.getElementById('statusCard').classList.remove('hidden');document.getElementById('questionArea').classList.remove('hidden');renderQuestion();}}catch(e){}
    }

    function renderQuestion(){
      if(!quiz.length) return;
      const q=quiz[current];
      document.getElementById('progressText').textContent=`Question ${current+1} of ${quiz.length}`;
      document.getElementById('topicText').textContent=`${q.topic} · ${q.level.charAt(0).toUpperCase()+q.level.slice(1)}`;
      const saved=answers[q.id];
      const area=document.getElementById('questionArea');
      area.innerHTML=`
        <div class="flex flex-wrap gap-2 mb-4"><span class="pill">${q.topic}</span><span class="pill">${q.level}</span><span class="pill">${q.id}</span></div>
        <h2 class="text-2xl font-black mb-5">${q.question}</h2>
        <div class="space-y-3" id="choices">
          ${q.choices.map((c,i)=>`<label class="choice ${saved!==undefined ? (i===q.answer?'correct':(i===saved?'incorrect':'')) : ''}"><input type="radio" name="choice" value="${i}" ${saved===i?'checked':''} ${saved!==undefined?'disabled':''}/><span><strong>${String.fromCharCode(65+i)}.</strong> ${c}</span></label>`).join('')}
        </div>
        <div id="feedback" class="mt-4 font-bold ${saved===undefined?'hidden':''}">${saved===q.answer?'✅ Correct':'❌ Incorrect'} — Correct answer: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</div>
        <div class="flex flex-wrap gap-3 mt-5 no-print">
          <button class="btn bg-blue-700 text-white" onclick="submitAnswer()">Submit / Check Answer</button>
          <button class="btn bg-white border" onclick="showAnswer()">Show Answer</button>
          <button class="btn bg-white border" onclick="prevQuestion()">Previous</button>
          <button class="btn bg-blue-700 text-white" onclick="nextQuestion()">Next</button>
        </div>`;
      if(window.MathJax?.typesetPromise) MathJax.typesetPromise([area]);
      saveState();
    }

    function submitAnswer(){
      const picked=document.querySelector('input[name="choice"]:checked');
      if(!picked){alert('Choose an answer first.');return;}
      answers[quiz[current].id]=parseInt(picked.value,10);
      renderQuestion();
    }
    function showAnswer(){ answers[quiz[current].id]=quiz[current].answer; renderQuestion(); }
    function nextQuestion(){ if(current<quiz.length-1){current++;renderQuestion();} else finishQuiz(); }
    function prevQuestion(){ if(current>0){current--;renderQuestion();} }
    function finishQuiz(){
      if(!quiz.length){alert('Generate a review first.');return;}
      let correct=0;
      quiz.forEach(q=>{if(answers[q.id]===q.answer) correct++;});
      const area=document.getElementById('summaryArea');
      area.classList.remove('hidden');
      area.innerHTML=`<h2 class="text-3xl font-black">Review Summary</h2><p class="text-xl mt-2">Score: <strong>${correct}/${quiz.length}</strong> (${Math.round(correct/quiz.length*100)}%)</p>
      <div class="mt-5 space-y-3">${quiz.map((q,i)=>`<div class="border rounded-xl p-3 ${answers[q.id]===q.answer?'bg-emerald-50':'bg-rose-50'}"><strong>${i+1}. ${q.id}</strong> · ${q.topic}<br>${q.question}<br><span>Your answer: ${answers[q.id]===undefined?'blank':String.fromCharCode(65+answers[q.id])}</span><br><span>Correct: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</span></div>`).join('')}</div>`;
      area.scrollIntoView({behavior:'smooth'});
      if(window.MathJax?.typesetPromise) MathJax.typesetPromise([area]);
    }
    function resetAll(){ if(confirm('Clear this generated review and answers?')){localStorage.removeItem('phys2-math-quiz');quiz=[];answers={};current=0;document.getElementById('statusCard').classList.add('hidden');document.getElementById('questionArea').classList.add('hidden');document.getElementById('summaryArea').classList.add('hidden');}}

    initTopics(); restoreState();
  </script>
</body>
</html>
