<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics II · Exam 2 Interactive Review</title>
  <meta name="description" content="Interactive Physics II Exam 2 review for resistance, DC circuits, and magnetism." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --navy: #0A1F3D;
      --primary: #065A82;
      --teal: #1C7293;
      --accent: #E76F51;
      --accent-light: #FBE6DE;
      --gold: #E9B44C;
      --gold-light: #FDF4D9;
      --success: #2A9D8F;
      --success-light: #E1F3EF;
      --red: #E63946;
      --ink: #0F172A;
      --ink2: #334155;
      --muted: #64748B;
      --rule: #E2E8F0;
      --bg: #F8FAFB;
      --card-bg: #FFFFFF;
      --f-display: Georgia, "Times New Roman", serif;
      --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--f-body);
      background: var(--bg);
      color: var(--ink);
    }
    html { scroll-behavior: smooth; }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      height: 56px; padding: 0 16px;
      background: var(--navy); color: white;
      box-shadow: 0 2px 12px rgba(10,31,61,0.15);
    }
    .topbar__menu {
      background: none; border: none; color: white; cursor: pointer;
      width: 38px; height: 38px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar__menu:hover { background: rgba(255,255,255,0.12); }
    .topbar__brand {
      font-family: var(--f-display);
      font-size: 18px; font-weight: 700; flex: 1;
    }
    .topbar__dot { color: var(--gold); margin: 0 6px; }
    .progress { width: 140px; height: 4px; background: rgba(255,255,255,0.16); border-radius: 999px; overflow: hidden; }
    .progress__bar { height: 100%; background: var(--gold); width: 12%; transition: width .3s ease; }

    .sidebar {
      position: fixed; top: 56px; left: 0; bottom: 0; width: 290px;
      background: white; border-right: 1px solid var(--rule);
      transform: translateX(-100%); transition: transform .25s ease;
      z-index: 90; overflow-y: auto; display: flex; flex-direction: column;
    }
    .sidebar--open { transform: translateX(0); }
    .sidebar-backdrop {
      position: fixed; inset: 56px 0 0 0;
      background: rgba(10,31,61,.35); z-index: 85; display: none;
    }
    .sidebar-backdrop.show { display: block; }
    .sidebar__head { padding: 24px 20px 20px; border-bottom: 1px solid var(--rule); }
    .sidebar__eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 6px;
    }
    .sidebar__title { font-family: var(--f-display); font-size: 26px; font-weight: 700; }
    .sidebar__sub { font-size: 13px; color: var(--accent); font-style: italic; }
    .sidebar__list { list-style: none; margin: 0; padding: 12px 10px; flex: 1; }
    .sidebar__link {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 3px;
      border-radius: 8px; text-decoration: none; color: var(--ink2); font-size: 14px;
      border-left: 3px solid transparent;
    }
    .sidebar__link:hover { background: #f8fafc; }
    .sidebar__link--active { background: var(--navy); color: white; border-left-color: var(--accent); }
    .sidebar__dot {
      width: 7px; height: 7px; border-radius: 999px; background: var(--primary); flex-shrink: 0;
    }
    .sidebar__link--active .sidebar__dot { background: var(--gold); }
    .sidebar__foot { padding: 14px 20px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }

    .main { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }
    .sec-header {
      margin: 56px 0 32px; padding: 40px 32px; border-radius: 16px;
      position: relative; overflow: hidden; background: var(--navy); color: white;
    }
    .sec-header::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    .sec-header--primary::before { background: var(--primary); }
    .sec-header--gold::before { background: var(--gold); }
    .sec-header--accent::before { background: var(--accent); }
    .sec-header--teal::before { background: var(--teal); }
    .sec-header--red::before { background: var(--red); }
    .sec-header__num {
      font-size: 13px; font-weight: 700; letter-spacing: 3px; opacity: .55; display: block; margin-bottom: 8px;
    }
    .sec-header__title {
      font-family: var(--f-display); font-size: clamp(26px, 5vw, 36px); font-weight: 700; line-height: 1.15; margin: 0;
    }
    .sec-header__sub { margin-top: 8px; font-size: 15px; color: rgba(255,255,255,.7); font-style: italic; }

    .content { padding: 0 4px; }
    .content p { line-height: 1.65; margin-bottom: 12px; color: var(--ink2); }
    .content__h3 {
      font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--ink);
      margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--rule);
    }

    .layers, .circuit-compare, .sign-grid, .strategy-grid, .var-grid, .two-eq, .big-insight__compare {
      display: grid; gap: 16px;
    }
    .layers { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .circuit-compare, .sign-grid, .two-eq, .big-insight__compare { grid-template-columns: 1fr 1fr; }
    .var-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .strategy-grid { grid-template-columns: 1fr 1fr; gap: 12px; }

    .card, .mc__opt, .reveal, .strategy-card {
      background: white; border: 1px solid var(--rule); border-radius: 12px;
    }
    .card { padding: 20px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .card--primary::before { background: var(--primary); }
    .card--teal::before { background: var(--teal); }
    .card--accent::before { background: var(--accent); }
    .card--success::before { background: var(--success); }
    .card__title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }
    .card__body { font-size: 14px; line-height: 1.6; }
    .card__body p { margin-bottom: 8px; }
    .card__body ol, .card__body ul { padding-left: 20px; }

    .eq {
      font-family: var(--f-display); font-size: 22px; font-weight: 700; font-style: italic; color: var(--primary);
      padding: 14px 20px; background: #f8fafc; border: 1px solid var(--rule); border-radius: 10px; text-align: center;
      margin: 12px 0; line-height: 1.5; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    }
    .eq--big { font-size: clamp(24px, 4.5vw, 34px); padding: 20px 24px; }
    .eq--teal { color: var(--teal); }
    .eq--accent { color: var(--accent); }
    .eq--success { color: var(--success); border-color: var(--success); background: var(--success-light); }

    .blank-wrap { display: inline-flex; align-items: center; gap: 4px; position: relative; }
    .blank {
      font-family: var(--f-display); font-size: inherit; font-weight: 700; text-align: center; border: none;
      border-bottom: 2.5px dashed var(--accent); background: transparent; color: var(--ink); padding: 2px 4px; outline: none;
    }
    .blank:focus { border-color: var(--primary); border-style: solid; }
    .blank--correct { border-color: var(--success); border-style: solid; color: var(--success); }
    .blank--wrong { border-color: var(--red); border-style: solid; color: var(--red); }
    .blank__check {
      width: 24px; height: 24px; border-radius: 999px; background: var(--primary); color: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .blank__answer {
      position: absolute; top: 100%; left: 0; margin-top: 2px; white-space: nowrap; font-size: 13px; color: var(--success); font-style: italic;
    }

    .reveal { margin: 16px 0; overflow: hidden; }
    .reveal__btn {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; font-size: 14px; font-weight: 600;
      color: var(--primary); cursor: pointer; border: none; background: none; text-align: left;
    }
    .reveal__btn:hover { background: #f8fafc; }
    .reveal__body { padding: 0 16px 16px; }
    .reveal--open { border-color: var(--primary); }

    .mc { margin: 20px 0; }
    .mc__q {
      font-family: var(--f-display); font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 12px; line-height: 1.4;
    }
    .mc__opts { display: flex; flex-direction: column; gap: 8px; }
    .mc__opt {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; text-align: left; font-size: 14px; color: var(--ink2);
      background: white;
    }
    .mc__opt:hover:not(:disabled) { border-color: var(--primary); background: #F0F7FB; }
    .mc__letter {
      width: 26px; height: 26px; border-radius: 999px; background: #f8fafc; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: var(--muted); flex-shrink: 0; border: 1px solid var(--rule);
    }
    .mc__opt--correct { border-color: var(--success); background: var(--success-light); }
    .mc__opt--correct .mc__letter { background: var(--success); color: white; border-color: var(--success); }
    .mc__opt--wrong { border-color: var(--red); background: #FDE8EA; }
    .mc__opt--wrong .mc__letter { background: var(--red); color: white; border-color: var(--red); }
    .mc__opt--dim { opacity: .45; }
    .mc__feedback {
      margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; line-height: 1.5;
    }
    .mc__feedback--right { background: var(--success-light); color: #166058; }
    .mc__feedback--wrong { background: #FDE8EA; color: #9B1B2A; }
    .mc__explain { font-weight: 400; font-style: italic; }

    .trap, .insight {
      display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; margin: 14px 0; border-radius: 0 8px 8px 0;
    }
    .trap { background: var(--accent-light); border-left: 4px solid var(--accent); font-size: 14px; }
    .insight {
      background: var(--gold-light); border-left: 4px solid var(--gold); font-family: var(--f-display); font-size: 16px; font-weight: 600; font-style: italic;
    }

    .power-grid { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .power-row { display: flex; align-items: center; gap: 14px; }
    .power-label { font-size: 13px; font-weight: 600; color: var(--muted); width: 120px; flex-shrink: 0; }
    .power-row .eq { flex: 1; margin: 0; }

    .big-insight {
      background: var(--navy); color: white; padding: 32px; border-radius: 14px; margin: 20px 0; text-align: center;
    }
    .big-insight__main { font-family: var(--f-display); font-size: clamp(18px, 4vw, 28px); font-weight: 700; margin-bottom: 8px; }
    .big-insight__em { color: var(--accent); font-size: 1.35em; letter-spacing: 3px; }
    .big-insight p { color: rgba(255,255,255,.72); }
    .big-insight__box { padding: 16px; border-radius: 10px; font-family: var(--f-display); font-size: 16px; font-weight: 600; }
    .big-insight__box--yes { background: rgba(202,220,252,0.2); color: #CADCFC; }
    .big-insight__box--no { background: rgba(231,111,81,0.25); color: #FBD0C4; }
    .big-insight__label { font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; opacity: .65; font-weight: 700; }

    .strategy-card {
      display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-left: 4px solid var(--primary);
    }
    .strategy-card__num {
      width: 30px; height: 30px; border-radius: 999px; background: var(--primary); color: white; font-family: var(--f-display); font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .strategy-card strong { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); }
    .strategy-card p { font-size: 13px; color: var(--ink2); margin: 4px 0 0; }

    .closer {
      margin: 48px 0 24px; padding: 48px 32px; background: var(--navy); color: white; border-radius: 16px; text-align: center;
    }
    .closer__text { font-family: var(--f-display); font-size: clamp(22px, 5vw, 38px); font-weight: 700; font-style: italic; }
    .closer__text em { color: var(--accent); }
    .closer__sub { margin-top: 14px; font-size: 16px; color: var(--gold); font-style: italic; }

    .diagram { width: 100%; max-width: 360px; margin: 12px auto; display: block; }
    .checklist { padding-left: 24px; margin: 12px 0; line-height: 1.7; font-size: 15px; }

    @media (max-width: 700px) {
      .var-grid, .circuit-compare, .sign-grid, .strategy-grid, .two-eq, .big-insight__compare { grid-template-columns: 1fr; }
      .main { padding: 0 12px 60px; }
      .sec-header { padding: 28px 20px; margin: 36px 0 20px; }
      .power-row { flex-direction: column; align-items: flex-start; gap: 6px; }
      .power-label { width: auto; }
    }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <header class="topbar">
    <button class="topbar__menu" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="topbar__brand">Physics II<span class="topbar__dot">·</span>Exam 2 Review</div>
    <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <div class="sidebar__eyebrow">Calculus-Based Physics II</div>
      <div class="sidebar__title">Exam 2 Review</div>
      <div class="sidebar__sub">Resistance · Circuits · Magnetism</div>
    </div>
    <ul class="sidebar__list" id="sidebarList"></ul>
    <div class="sidebar__foot"><p>Fill blanks · Reveal answers · Test yourself</p></div>
  </nav>

  <main class="main" id="mainContent"></main>

  <script>
    const sections = [
      { id: 'overview', label: 'Big Picture', color: 'primary' },
      { id: 'resistance', label: 'Resistance & Current', color: 'gold' },
      { id: 'circuits', label: 'DC Circuits', color: 'accent' },
      { id: 'magnetism', label: 'Magnetism', color: 'red' },
      { id: 'fields', label: 'Currents → Fields', color: 'teal' },
      { id: 'forces', label: 'Forces & Applications', color: 'accent' },
      { id: 'induction', label: 'Induction Preview', color: 'gold' },
      { id: 'exammode', label: 'Exam Mode', color: 'gold' },
    ];

    const main = document.getElementById('mainContent');
    const sidebarList = document.getElementById('sidebarList');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const menuBtn = document.getElementById('menuBtn');
    const progressBar = document.getElementById('progressBar');

    function eq(content, big = false, color = '') {
      return `<div class="eq ${big ? 'eq--big' : ''} ${color ? 'eq--' + color : ''}">${content}</div>`;
    }

    function card(title, body, accent = '') {
      return `<div class="card ${accent ? 'card--' + accent : ''}">${title ? `<div class="card__title">${title}</div>` : ''}<div class="card__body">${body}</div></div>`;
    }

    function reveal(label, content) {
      return `<div class="reveal"><button class="reveal__btn"><span>▸</span>${label}</button><div class="reveal__body" hidden>${content}</div></div>`;
    }

    function blank(id, answer, width = 120) {
      return `<span class="blank-wrap"><input class="blank" data-answer="${answer.toLowerCase()}" data-blank-id="${id}" style="width:${width}px" placeholder="?" spellcheck="false" /><button class="blank__check" type="button">✓</button><span class="blank__answer" hidden>${answer}</span></span>`;
    }

    function mc(id, question, options, correctIndex, explanation) {
      return `
        <div class="mc" data-mc-id="${id}" data-correct="${correctIndex}">
          <p class="mc__q">${question}</p>
          <div class="mc__opts">
            ${options.map((opt, i) => `<button class="mc__opt" type="button" data-index="${i}"><span class="mc__letter">${'ABCDE'[i]}</span>${opt}</button>`).join('')}
          </div>
          <div class="mc__feedback" hidden></div>
        </div>
      `;
    }

    function sectionHeader(id, number, title, subtitle, color) {
      return `
        <section class="sec-header sec-header--${color}" id="${id}">
          <span class="sec-header__num">${number}</span>
          <h2 class="sec-header__title">${title}</h2>
          ${subtitle ? `<p class="sec-header__sub">${subtitle}</p>` : ''}
        </section>
      `;
    }

    function wireDiagram() {
      return `
        <svg viewBox="0 0 400 100" class="diagram" aria-label="Wire with length L and cross-section A">
          <defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C9A97B"/><stop offset="100%" stop-color="#E8D5B5"/></linearGradient></defs>
          <rect x="60" y="25" width="280" height="50" rx="6" fill="url(#wg)" stroke="#334155" stroke-width="2"/>
          <ellipse cx="60" cy="50" rx="12" ry="25" fill="#C9A97B" stroke="#334155" stroke-width="2"/>
          <ellipse cx="340" cy="50" rx="12" ry="25" fill="#C9A97B" stroke="#334155" stroke-width="2"/>
          <line x1="80" y1="88" x2="320" y2="88" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrowB)"/>
          <text x="200" y="98" text-anchor="middle" font-size="14" font-style="italic" fill="#0F172A" font-family="Georgia">L</text>
          <line x1="38" y1="25" x2="38" y2="75" stroke="#0F172A" stroke-width="1.5"/>
          <text x="24" y="55" text-anchor="middle" font-size="14" font-style="italic" fill="#0F172A" font-family="Georgia">A</text>
          <defs><marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#0F172A"/></marker></defs>
        </svg>
      `;
    }

    function seriesCircuit() {
      return `
        <svg viewBox="0 0 300 180" class="diagram" aria-label="Series circuit">
          <rect x="30" y="30" width="240" height="120" fill="none" stroke="#334155" stroke-width="2"/>
          <line x1="30" y1="75" x2="30" y2="85" stroke="#334155" stroke-width="4"/>
          <line x1="30" y1="88" x2="30" y2="95" stroke="#334155" stroke-width="4"/>
          <text x="12" y="95" font-size="14" font-style="italic" fill="#334155" font-family="Georgia">ε</text>
          <rect x="90" y="22" width="40" height="16" fill="white" stroke="#065A82" stroke-width="2"/>
          <text x="110" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#065A82">R₁</text>
          <rect x="170" y="22" width="40" height="16" fill="white" stroke="#065A82" stroke-width="2"/>
          <text x="190" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#065A82">R₂</text>
          <line x1="130" y1="155" x2="170" y2="155" stroke="#E76F51" stroke-width="2.5" marker-end="url(#arrI)"/>
          <text x="152" y="172" text-anchor="middle" font-size="13" font-style="italic" font-weight="bold" fill="#E76F51" font-family="Georgia">I</text>
          <defs><marker id="arrI" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#E76F51"/></marker></defs>
        </svg>
      `;
    }

    function parallelCircuit() {
      return `
        <svg viewBox="0 0 300 200" class="diagram" aria-label="Parallel circuit">
          <line x1="40" y1="30" x2="260" y2="30" stroke="#334155" stroke-width="2"/>
          <line x1="40" y1="170" x2="260" y2="170" stroke="#334155" stroke-width="2"/>
          <line x1="40" y1="30" x2="40" y2="170" stroke="#334155" stroke-width="2"/>
          <line x1="260" y1="30" x2="260" y2="170" stroke="#334155" stroke-width="2"/>
          <line x1="33" y1="85" x2="47" y2="85" stroke="#334155" stroke-width="4"/>
          <line x1="36" y1="95" x2="44" y2="95" stroke="#334155" stroke-width="4"/>
          <text x="18" y="95" font-size="14" font-style="italic" fill="#334155" font-family="Georgia">ε</text>
          <line x1="120" y1="30" x2="120" y2="170" stroke="#334155" stroke-width="2"/>
          <line x1="190" y1="30" x2="190" y2="170" stroke="#334155" stroke-width="2"/>
          <rect x="110" y="85" width="20" height="35" fill="white" stroke="#065A82" stroke-width="2"/>
          <text x="100" y="107" text-anchor="end" font-size="12" font-weight="600" fill="#065A82">R₁</text>
          <rect x="180" y="85" width="20" height="35" fill="white" stroke="#065A82" stroke-width="2"/>
          <text x="210" y="107" font-size="12" font-weight="600" fill="#065A82">R₂</text>
        </svg>
      `;
    }

    function rhrDiagram() {
      return `
        <svg viewBox="0 0 280 200" class="diagram" aria-label="Right hand rule: v right, B up, F out of page">
          <circle cx="140" cy="120" r="18" fill="#E63946"/>
          <text x="140" y="127" text-anchor="middle" font-size="22" font-weight="bold" fill="white">+</text>
          <line x1="162" y1="120" x2="250" y2="120" stroke="#E76F51" stroke-width="3" marker-end="url(#av)"/>
          <text x="255" y="125" font-size="16" font-style="italic" font-weight="bold" fill="#E76F51" font-family="Georgia">v</text>
          <line x1="140" y1="98" x2="140" y2="20" stroke="#1C7293" stroke-width="3" marker-end="url(#aB)"/>

        const btn = revealEl.querySelector('.reveal__btn');
        const body = revealEl.querySelector('.reveal__body');
        btn.addEventListener('click', () => {
          const open = !body.hidden;
          body.hidden = open;
          revealEl.classList.toggle('reveal--open', !open);
          btn.querySelector('span').textContent = open ? '▸' : '▾';
          if (window.MathJax?.typesetPromise) MathJax.typesetPromise();
        });
      });

      document.querySelectorAll('.blank-wrap').forEach(wrap => {
        const input = wrap.querySelector('.blank');
        const btn = wrap.querySelector('.blank__check');
        const answerEl = wrap.querySelector('.blank__answer');
        btn.addEventListener('click', () => {
          const correct = input.value.trim().toLowerCase() === input.dataset.answer;
          input.classList.remove('blank--correct', 'blank--wrong');
          input.classList.add(correct ? 'blank--correct' : 'blank--wrong');
          answerEl.hidden = correct;
        });
        input.addEventListener('input', () => {
          input.classList.remove('blank--correct', 'blank--wrong');
          answerEl.hidden = true;
        });
      });

      document.querySelectorAll('.mc').forEach(mcEl => {

              mc2: 'The field sets all charges in motion nearly simultaneously — like pushing one end of a full hose.',
              mc3: 'R = ρL/A. L doubles while area quadruples, so resistance halves.',

            feedback.hidden = false;
            feedback.className = 'mc__feedback ' + (selected === correctIndex ? 'mc__feedback--right' : 'mc__feedback--wrong');
            feedback.textContent = (selected === correctIndex ? '✓ Correct! ' : '✗ Not quite. ') + (explanations[mcEl.dataset.mcId] || '');
          });
        });
      });
    }

    function initSidebar() {
      const navLinks = [...document.querySelectorAll('[data-nav]')];
      navLinks.forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const id = link.dataset.nav;
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          closeSidebar();
        });
      });

      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        const currentId = visible.target.id;
        navLinks.forEach(link => link.classList.toggle('sidebar__link--active', link.dataset.nav === currentId));
        const idx = sections.findIndex(s => s.id === currentId);
        if (idx >= 0) progressBar.style.width = `${((idx + 1) / sections.length) * 100}%`;
      }, { rootMargin: '-20% 0px -60% 0px', threshold: [0.2, 0.5, 0.8] });

      sections.forEach(s => {
        const el = document.getElementById(s.id);
        if (el) observer.observe(el);
      });
    }

    function openSidebar() {
      sidebar.classList.add('sidebar--open');
      sidebarBackdrop.classList.add('show');
    }
    function closeSidebar() {
      sidebar.classList.remove('sidebar--open');
      sidebarBackdrop.classList.remove('show');
    }
    menuBtn.addEventListener('click', () => sidebar.classList.contains('sidebar--open') ? closeSidebar() : openSidebar());
    sidebarBackdrop.addEventListener('click', closeSidebar);

    render();
  </script>
</body>
</html>
